<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration universités">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#bg)"/>
  <!-- bâtiment université -->
  <g transform="translate(90,60)">
    <polygon points="110,0 220,45 0,45" fill="url(#gold)"/>
    <rect x="0" y="50" width="220" height="12" fill="#FBBF24" opacity="0.9"/>
    <rect x="12" y="70" width="196" height="90" fill="rgba(255,255,255,0.12)"/>
    <g fill="#FBBF24">
      <rect x="28" y="85" width="18" height="42" rx="2"/>
      <rect x="62" y="85" width="18" height="42" rx="2"/>
      <rect x="140" y="85" width="18" height="42" rx="2"/>
      <rect x="174" y="85" width="18" height="42" rx="2"/>
      <rect x="101" y="85" width="18" height="75" rx="2" fill="#F97316"/>
    </g>
    <rect x="0" y="160" width="220" height="10" rx="4" fill="rgba(255,255,255,0.25)"/>
  </g>
  <!-- laurier -->
  <g stroke="#4F46E5" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(320,180)">
    <path d="M0,40 Q-8,20 8,4"/><path d="M0,40 Q10,22 -4,8"/>
  </g>
  <circle cx="52" cy="52" r="5" fill="#F97316" opacity="0.7"/>
  <circle cx="350" cy="40" r="8" fill="#4F46E5" opacity="0.8"/>
  <circle cx="330" cy="120" r="3" fill="#FBBF24" opacity="0.6"/>
</svg>
