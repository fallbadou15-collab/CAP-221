<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration préparation au BAC">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#bg2)"/>
  <!-- livre ouvert -->
  <g transform="translate(80,70)">
    <path d="M120,20 C90,0 50,0 10,12 L10,110 C50,98 90,98 120,118 Z" fill="#F8FAFC" opacity="0.95"/>
    <path d="M120,20 C150,0 190,0 230,12 L230,110 C190,98 150,98 120,118 Z" fill="#E2E8F0" opacity="0.95"/>
    <g stroke="#94A3B8" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="34" x2="100" y2="26"/><line x1="30" y1="54" x2="100" y2="46"/>
      <line x1="30" y1="74" x2="100" y2="66"/><line x1="140" y1="26" x2="210" y2="34"/>
      <line x1="140" y1="46" x2="210" y2="54"/><line x1="140" y1="66" x2="210" y2="74"/>
    </g>
  </g>
  <!-- diplôme -->
  <g transform="translate(300,150) rotate(12)">
    <rect x="-45" y="-30" width="90" height="60" rx="6" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#C2570C" stroke-width="4"/>
    <path d="M-8,0 L-2,7 L10,-7" stroke="#C2570C" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- crayon -->
  <g transform="translate(46,150) rotate(-18)">
    <rect x="-8" y="-50" width="16" height="80" rx="3" fill="#F97316"/>
    <polygon points="-8,30 8,30 0,50" fill="#FBBF24"/>
    <rect x="-8" y="-58" width="16" height="10" fill="#4F46E5"/>
  </g>
  <circle cx="60" cy="48" r="6" fill="#4F46E5" opacity="0.8"/>
  <circle cx="352" cy="42" r="4" fill="#F97316" opacity="0.7"/>
</svg>
