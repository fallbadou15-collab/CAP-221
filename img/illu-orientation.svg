<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Illustration orientation et métiers">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/><stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#bg3)"/>
  <!-- boussole -->
  <g transform="translate(200,130)">
    <circle r="86" fill="none" stroke="#4F46E5" stroke-width="6" opacity="0.9"/>
    <circle r="72" fill="rgba(255,255,255,0.06)"/>
    <g stroke="rgba(255,255,255,0.4)" stroke-width="3">
      <line y1="-72" y2="-60"/><line y1="72" y2="60"/><line x1="-72" x2="-60"/><line x1="72" x2="60"/>
    </g>
    <polygon points="0,-56 16,0 0,10" fill="#F97316"/>
    <polygon points="0,-56 -16,0 0,10" fill="#FBBF24"/>
    <circle r="8" fill="#F8FAFC"/>
  </g>
  <!-- tags métiers -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="30" y="34" width="96" height="28" rx="14" fill="url(#rose)"/><text x="78" y="53" fill="#0F172A">Médecin</text>
    <rect x="274" y="34" width="96" height="28" rx="14" fill="#4F46E5"/><text x="322" y="53" fill="#fff">Ingénieur</text>
    <rect x="20" y="196" width="104" height="28" rx="14" fill="#10B981"/><text x="72" y="215" fill="#0F172A">Avocat</text>
    <rect x="278" y="196" width="102" height="28" rx="14" fill="#FBBF24"/><text x="329" y="215" fill="#0F172A">Designer</text>
  </g>
  <circle cx="56" cy="120" r="4" fill="#F97316" opacity="0.7"/>
  <circle cx="344" cy="120" r="6" fill="#4F46E5" opacity="0.8"/>
</svg>
