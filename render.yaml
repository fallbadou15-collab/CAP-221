services:
  - type: web
    name: cap-221
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESET_FROM_EMAIL
        sync: false
      - key: PUBLIC_URL
        value: https://cap221.com
      - key: TURNSTILE_SECRET_KEY
        sync: false
